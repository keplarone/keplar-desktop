<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"
    />
    <title>Keplar One is offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0b0d;
      }
      body {
        color: #f4f4f5;
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 420px;
        text-align: center;
        padding: 32px 24px;
      }
      svg {
        width: 64px;
        height: 64px;
        display: block;
        margin: 0 auto;
      }
      h1 {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.03em;
        margin: 18px 0 10px;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        font-size: 15px;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 22px;
        background: #f4f4f5;
        color: #0b0b0d;
        text-decoration: none;
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 14px;
      }
      a:focus-visible {
        outline: 2px solid #f4f4f5;
        outline-offset: 3px;
      }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; }
        html, body { background-color: #f7f6f3; color: #141518; }
        body { background: transparent; }
        html {
          background-image:
            radial-gradient(46vmax 40vmax at 22% -8%, rgba(255, 156, 122, 0.7), transparent 68%),
            radial-gradient(44vmax 40vmax at 96% 0%, rgba(168, 146, 255, 0.55), transparent 66%),
            radial-gradient(42vmax 36vmax at 70% 108%, rgba(98, 198, 214, 0.5), transparent 70%),
            radial-gradient(38vmax 34vmax at 40% 100%, rgba(255, 196, 140, 0.48), transparent 72%);
          background-repeat: no-repeat;
          background-size: 150% 150%;
        }
        p { color: #3a3d44; }
        svg g { fill: #141518; }
        svg { filter: drop-shadow(0 0 28px rgba(255, 156, 122, 0.65)) drop-shadow(0 0 52px rgba(168, 146, 255, 0.45)); }
        a {
          background: #141518;
          color: #fffcf8;
          box-shadow: 0 12px 32px -12px rgba(255, 140, 110, 0.75), 0 10px 28px -16px rgba(150, 120, 255, 0.6);
        }
        a:focus-visible { outline-color: #075e6c; }
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <g fill="#ffffff" transform="translate(41 41) scale(1.0723192) translate(-76 -76)">
          <rect x="76" y="76" width="232" height="232" rx="74" />
          <path d="M295 76h143c11 0 18 7 18 18v151c0 8-4 12-9 9L283 92c-8-8-2-16 12-16Z" />
          <circle cx="358" cy="358" r="119" />
        </g>
      </svg>
      <h1>Keplar One isn’t reachable</h1>
      <p>
        This app is a window onto keplar.one. Questions and answers are not
        kept in the app for offline use. Check the connection, then try again.
      </p>
      <a href="{{RETRY_URL}}">Try again</a>
    </main>
  </body>
</html>
