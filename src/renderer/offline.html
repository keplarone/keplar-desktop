<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"
    />
    <title>Keplar One is offline</title>
    <style>
      :root {
        color-scheme: dark;
        --keplar-titlebar: 36px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0b0d;
      }
      body {
        color: #f4f4f5;
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        display: grid;
        place-items: center;
      }
      body::before {
        content: "";
        position: fixed;
        z-index: 2;
        top: 0;
        left: 0;
        right: 140px;
        height: var(--keplar-titlebar);
        -webkit-app-region: drag;
      }
      main {
        max-width: 420px;
        text-align: center;
        padding: 32px 24px;
      }
      svg {
        width: 64px;
        height: 64px;
        display: block;
        margin: 0 auto;
      }
      h1 {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.03em;
        margin: 18px 0 10px;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        font-size: 15px;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 22px;
        background: #f4f4f5;
        color: #0b0b0d;
        text-decoration: none;
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 14px;
        -webkit-app-region: no-drag;
      }
      a:focus-visible {
        outline: 2px solid #f4f4f5;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <g fill="#ffffff" transform="translate(41 41) scale(1.0723192) translate(-76 -76)">
          <rect x="76" y="76" width="232" height="232" rx="74" />
          <path d="M295 76h143c11 0 18 7 18 18v151c0 8-4 12-9 9L283 92c-8-8-2-16 12-16Z" />
          <circle cx="358" cy="358" r="119" />
        </g>
      </svg>
      <h1>Keplar One isn’t reachable</h1>
      <p>
        This app is a window onto keplar.one. Questions and answers are not
        kept in the app for offline use. Check the connection, then try again.
      </p>
      <a href="{{RETRY_URL}}">Try again</a>
    </main>
  </body>
</html>
