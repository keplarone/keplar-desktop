<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"
    />
    <title>Keplar One</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0b0d;
      }
      body {
        color: #f4f4f5;
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        display: grid;
        place-items: center;
      }
      main {
        text-align: center;
        padding: 32px 24px;
      }
      svg {
        width: 72px;
        height: 72px;
        display: block;
        margin: 0 auto;
      }
      h1 {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.03em;
        margin: 18px 0 8px;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        font-size: 15px;
        line-height: 1.45;
      }
      .bar {
        margin: 28px auto 0;
        width: 128px;
        height: 2px;
        background: #27272a;
        overflow: hidden;
        border-radius: 2px;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 40%;
        background: #f4f4f5;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar span {
          animation: none;
          width: 100%;
          opacity: 0.45;
        }
      }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; }
        html, body { background-color: #f7f6f3; color: #141518; }
        body { background: transparent; }
        html {
          background-image:
            radial-gradient(46vmax 40vmax at 22% -8%, rgba(255, 156, 122, 0.7), transparent 68%),
            radial-gradient(44vmax 40vmax at 96% 0%, rgba(168, 146, 255, 0.55), transparent 66%),
            radial-gradient(42vmax 36vmax at 70% 108%, rgba(98, 198, 214, 0.5), transparent 70%),
            radial-gradient(38vmax 34vmax at 40% 100%, rgba(255, 196, 140, 0.48), transparent 72%);
          background-repeat: no-repeat;
          background-size: 150% 150%;
        }
        p { color: #3a3d44; }
        svg g { fill: #141518; }
        svg { filter: drop-shadow(0 0 28px rgba(255, 156, 122, 0.65)) drop-shadow(0 0 52px rgba(168, 146, 255, 0.45)); }
        .bar { background: #1415181a; }
        .bar span { background: #141518; }
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <g fill="#ffffff" transform="translate(41 41) scale(1.0723192) translate(-76 -76)">
          <rect x="76" y="76" width="232" height="232" rx="74" />
          <path d="M295 76h143c11 0 18 7 18 18v151c0 8-4 12-9 9L283 92c-8-8-2-16 12-16Z" />
          <circle cx="358" cy="358" r="119" />
        </g>
      </svg>
      <h1>Keplar One</h1>
      <p>One question. Multiple intelligences. One answer.</p>
      <div class="bar" role="progressbar" aria-label="Opening Keplar One">
        <span></span>
      </div>
    </main>
  </body>
</html>
