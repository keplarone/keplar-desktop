name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0. Must match package.json.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Linux packaging tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const tag = process.env.GITHUB_REF_TYPE === "tag"
            ? process.env.GITHUB_REF_NAME
            : process.env.INPUT_TAG;
          if (tag !== `v${version}`) {
            console.error(`Tag ${tag} does not match package.json version ${version}.`);
            process.exit(1);
          }
          EOF

      - name: Package
        run: npm run dist:release -- ${{ matrix.target }}
        env:
          # Empty secrets are removed by scripts/build-release.mjs so the
          # build stays unsigned and still succeeds.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Collect release files
        run: node scripts/collect-release-files.mjs

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: keplar-${{ matrix.target }}
          if-no-files-found: error
          path: ship/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: keplar-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${INPUT_TAG}"
          fi
          case "${TAG}" in
            v*) ;;
            *)
              echo "Refusing to publish '${TAG}'. Tags must look like v0.1.0."
              exit 1
              ;;
          esac

          cd artifacts
          find . -type f ! -name SHA256SUMS -printf '%P\n' | sort > ../filelist.txt
          if [ ! -s ../filelist.txt ]; then
            echo "No release files were produced."
            exit 1
          fi
          echo "Release files:"
          cat ../filelist.txt
          xargs -a ../filelist.txt sha256sum > SHA256SUMS
          echo "SHA256SUMS" >> ../filelist.txt

          if gh release view "${TAG}" >/dev/null 2>&1; then
            xargs -a ../filelist.txt gh release upload "${TAG}" --clobber
          else
            xargs -a ../filelist.txt gh release create "${TAG}" \
              --title "Keplar ${TAG}" \
              --generate-notes
          fi
          gh release view "${TAG}" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
